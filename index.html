</style></head><body><div class="app"><header class="hero"><div class="eyebrow">SOMDA GUITAR LAB</div><h1>My Jazz Guitar Studio ♫</h1><div class="muted">Jazz · Bossa Nova · Voicings · Daily Practice</div></header><nav class="tabs" id="tabs"></nav><main id="content"></main><p class="footer">연습 기록은 이 기기의 브라우저에 저장됩니다. 다른 기기와 자동 동기화되지는 않습니다. 악보는 포함된 곡별 이미지 자료를 사용하며, 원본 페이지 구분은 일부 검수가 필요합니다.</p></div><script src="songs.js"></script><script>
'use strict';const KEY=['C','G','D','A','E','B','G♭','D♭','A♭','E♭','B♭','F'],ROOT=[0,7,2,9,4,11,6,1,8,3,10,5],PC=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'],OPEN=[4,11,7,2],TABS=[['home','홈'],['scale','스케일'],['tones','코드톤'],['voice','보이싱'],['lick','재즈 릭'],['head','헤드'],['calendar','달력']];const QUAL={maj7:{name:'maj7',iv:[0,4,7,11],dg:['1','3','5','7']},m7:{name:'m7',iv:[0,3,7,10],dg:['1','♭3','5','♭7']},dom7:{name:'7',iv:[0,4,7,10],dg:['1','3','5','♭7']},half:{name:'m7♭5',iv:[0,3,6,10],dg:['1','♭3','♭5','♭7']},dim:{name:'dim7',iv:[0,3,6,9],dg:['1','♭3','♭5','𝄫7']},m6:{name:'m6',iv:[0,3,7,9],dg:['1','♭3','5','6']}};const TENSIONS={maj7:['9','♯11','13'],m7:['9','11','13'],dom7:['♭9','9','♯9','♯11','♭13','13'],half:['9','11','♭13'],dim:['9','11'],m6:['9','11']},TINT={'♭9':1,'9':2,'♯9':3,'11':5,'♯11':6,'♭13':8,'13':9};const SCALES={major:['Major',[0,2,4,5,7,9,11]],dorian:['Dorian',[0,2,3,5,7,9,10]],mix:['Mixolydian',[0,2,4,5,7,9,10]],mel:['Melodic Minor',[0,2,3,5,7,9,11]],pent:['Minor Pentatonic',[0,3,5,7,10]],harm:['Harmonic Minor',[0,2,3,5,7,8,11]]};const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const initial={tab:'home',key:0,bpm:60,scale:'major',pattern:'up',toneMode:'guide',quality:'maj7',rootString:1,voiceMode:'basic',tension:'9',shape:0,display:'both',reveal:true,lick:'major',songIndex:0,book:'전체',songHistory:[],hideScore:false,logs:{},done:{},month:today().slice(0,7),day:today()};let stored={};try{stored=JSON.parse(localStorage.getItem('somda-guitar-lab-v1')||'{}')}catch{};const s={...initial,...stored};const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem('somda-guitar-lab-v1',JSON.stringify(s))}catch(e){console.warn('저장 실패',e)}};const change=(k,v)=>{s[k]=v;if(['key','quality','rootString','voiceMode','tension'].includes(k))s.shape=0;save();render()};const button=(label,fn,extra='')=>`<button class="btn ${extra}" onclick="${fn}">${label}</button>`;const select=(k,options)=>`<select onchange="change('${k}',this.value)">${options.map(([v,t])=>`<option value="${esc(v)}" ${String(s[k])===String(v)?'selected':''}>${esc(t)}</option>`).join('')}</select>`;const control=(label,inner)=>`<div class="control"><label>${label}</label>${inner}</div>`;const panel=(html)=>`<section class="panel">${html}</section>`;const pc=(n)=>PC[(n%12+12)%12];const completeId=()=>`${s.tab}|${s.key}|${s.tab==='voice'?[s.quality,s.rootString,s.voiceMode,s.tension].join(':'):s.tab==='scale'?s.scale:s.tab==='head'?s.songIndex:s.tab==='lick'?s.lick:s.toneMode}`;
function keyPicker(){return panel(`<div class="row between"><b>5도권 · 12키</b><span class="muted">${KEY.filter((_,i)=>s.done[`${s.tab}|${i}|${s.tab==='voice'?[s.quality,s.rootString,s.voiceMode,s.tension].join(':'):s.tab==='scale'?s.scale:s.tab==='head'?s.songIndex:s.tab==='lick'?s.lick:s.toneMode}`]).length}/12 완료</span></div><div class="grid six" style="margin:12px 0">${KEY.map((k,i)=>button(`${k}${s.done[`${s.tab}|${i}|${s.tab==='voice'?[s.quality,s.rootString,s.voiceMode,s.tension].join(':'):s.tab==='scale'?s.scale:s.tab==='head'?s.songIndex:s.tab==='lick'?s.lick:s.toneMode}`]?' ✓':''}`,`change('key',${i})`,`keybtn ${s.key===i?'active':''}`)).join('')}</div><div class="row between">${button('‹ 이전',`change('key',${(s.key+11)%12})`)}<b>${KEY[s.key]} Key</b>${button('다음 ›',`change('key',${(s.key+1)%12})`,'primary')}</div>`)}
function tempo(){return panel(`<div class="row between"><b>Tempo</b><div class="row">${button('−',`change('bpm',${Math.max(40,s.bpm-5)})`)}<b>${s.bpm} BPM</b>${button('+',`change('bpm',${Math.min(220,s.bpm+5)})`)}${button(metro?'■ 정지':'▶ 메트로놈','toggleMetro()',metro?'active':'')}</div></div>`)}
let audioCtx=null,metro=null;function beep(){if(!audioCtx)return;let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(.13,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.065);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.07)}function toggleMetro(){if(metro){clearInterval(metro);metro=null}else{try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();beep();metro=setInterval(beep,60000/s.bpm)}catch(e){alert('이 브라우저에서 오디오를 사용할 수 없습니다.')}}render()}function resetMetro(){if(metro){clearInterval(metro);metro=setInterval(beep,60000/s.bpm)}}
function bottom(){return panel(`<div class="row between"><b>현재 연습</b><span class="tag">${esc(KEY[s.key])} Key</span></div><div class="row" style="margin-top:12px">${button(s.done[completeId()]?'✓ 완료 취소':'✓ 연습 완료',`markDone()`,'primary')}${button('달력에 기록',`goCalendar()` )}</div>`)}function markDone(){let k=completeId();s.done[k]=!s.done[k];save();render()}function goCalendar(){s.logCategory={scale:'스케일',tones:'코드톤',voice:'재즈 보이싱',lick:'재즈 릭',head:'헤드 멜로디'}[s.tab]||'기타';s.tab='calendar';s.day=today();s.month=today().slice(0,7);save();render()}
function home(){let entries=Object.values(s.logs).flat(),todayEntries=s.logs[today()]||[];let stat=(n,t)=>`<div class="stat"><small>${t}</small><strong>${n}</strong></div>`;return panel(`<h2>오늘의 연습</h2><p class="muted">${today()}</p><div class="stats">${stat(todayEntries.reduce((a,b)=>a+b.min,0)+'분','오늘')}${stat(entries.reduce((a,b)=>a+b.min,0)+'분','누적')}${stat(Object.values(s.logs).filter(x=>x.length).length+'일','연습일')}</div>`)+panel(`<h3>추천 루틴 · 50분</h3>${[['scale','스케일','10분 · 5도권 패턴'],['tones','코드톤','10분 · 가이드톤'],['voice','재즈 보이싱','10분 · 루트 위치'],['lick','재즈 릭','10분 · ii–V–I'],['head','헤드 멜로디','10분 · 랜덤 한 곡']].map(([id,n,d])=>`<button class="btn" style="width:100%;display:flex;justify-content:space-between;margin:7px 0;text-align:left" onclick="change('tab','${id}')"><span>${n}</span><span class="muted">${d} ›</span></button>`).join('')}`)}
function scale(){let sc=SCALES[s.scale],ns=sc[1].map(x=>pc(ROOT[s.key]+x));return keyPicker()+panel(`<h2>Scale Practice</h2><div class="controls">${control('스케일',select('scale',Object.entries(SCALES).map(([k,v])=>[k,v[0]])))}${control('패턴',select('pattern',[['up','상행·하행'],['third','3도 패턴'],['four','4음 시퀀스'],['single','한 줄 연주'],['position','포지션 이동']]))}</div><h3 style="margin-top:18px">${KEY[s.key]} ${sc[0]}</h3><div class="tiles">${ns.map(n=>`<div class="tile">${n}</div>`).join('')}</div><div class="practice" style="margin-top:13px">${({up:'음계를 위아래로 연주해 봐.',third:'한 음씩 건너뛰어 3도 진행으로 연주해 봐.',four:'4음씩 묶어 시퀀스를 이동해 봐.',single:'한 줄 위에서 포지션을 옮기며 연주해 봐.',position:'포지션을 연결하면서 음의 위치를 익혀 봐.'})[s.pattern]} 각 키를 같은 BPM으로 반복해 봐.</div></section>`).replace('</section></section>','</section>')+tempo()+bottom()}
function tones(){let r=ROOT[s.key],prog=[[2,'m7',3,10],[7,'7',4,10],[0,'maj7',4,11]];return keyPicker()+panel(`<h2>Chord Tone Training</h2>${control('연습 과제',select('toneMode',[['guide','3도·7도 가이드톤 연결'],['line','1·3·5·7 멜로디 만들기'],['target','다음 코드 3도에 도착하기']]))}<h3 style="margin-top:17px">ii–V–I · ${KEY[s.key]}</h3><div class="grid" style="grid-template-columns:repeat(3,minmax(0,1fr))">${prog.map(([step,name,third,sev],i)=>`<div class="note-card"><small>${['ii','V','I'][i]}</small><b style="font-size:16px">${pc(r+step)}${name}</b><div>${pc(r+step+third)} · ${pc(r+step+sev)}</div><small>3도 · 7도</small></div>`).join('')}</div><div class="practice" style="margin-top:14px">${({guide:'각 코드의 3도와 7도를 가장 짧은 움직임으로 연결해 봐.',line:'코드톤 1·3·5·7만 사용해 2마디 멜로디를 만들어 봐.',target:'다음 코드 첫 박에 3도가 오도록 프레이즈를 만들어 봐.'})[s.toneMode]}</div>`)+tempo()+bottom()}
function voicings(){let r=ROOT[s.key],q=QUAL[s.quality],topts=TENSIONS[s.quality],t=topts.includes(s.tension)?s.tension:topts[0],allowed=s.voiceMode==='basic'?q.iv:[...q.iv,TINT[t]];let arr=[];for(let base=0;base<=15;base++){for(let a=0;a<=4;a++)for(let b=0;b<=4;b++)for(let c=0;c<=4;c++)for(let d=0;d<=4;d++){let fs=[base+a,base+b,base+c,base+d];if(fs.some(f=>f>19))continue;let iv=fs.map((f,i)=>(OPEN[i]+f-r+120)%12);if(iv[s.rootString-1]!==0||iv.some((v,i)=>i!==s.rootString-1&&v===0))continue;if(iv.some(x=>!allowed.includes(x))||new Set(iv).size<3||!iv.includes(q.iv[1]))continue;if(s.voiceMode==='basic'&&!iv.includes(q.iv[3]))continue;if(s.voiceMode==='tension'&&!iv.includes(TINT[t]))continue;arr.push({fs,iv,score:Math.max(...fs)-Math.min(...fs)+Math.min(...fs)*.055})}}arr.sort((a,b)=>a.score-b.score);let index=arr.length?s.shape%arr.length:0,v=arr[index];const dg=x=>{let i=q.iv.indexOf(x);return i>=0?q.dg[i]:Object.keys(TINT).find(k=>TINT[k]===x)||'?'};let fret='';if(v){let lo=Math.max(0,Math.min(...v.fs)-1),step=46;fret=`<svg viewBox="0 0 360 190" role="img" aria-label="${KEY[s.key]}${q.name} 기타 보이싱"><rect x="64" y="16" width="280" height="140" rx="5" fill="#e0c29b"/>${Array.from({length:7},(_,i)=>`<line x1="${64+i*46}" y1="16" x2="${64+i*46}" y2="156" stroke="#9d886e" stroke-width="${lo===0&&i===0?5:2}"/>${i<6?`<text x="${87+i*46}" y="176" font-size="11" text-anchor="middle" fill="#554736">${lo+i}</text>`:''}`).join('')}${['E','B','G','D'].map((n,i)=>`<line x1="64" y1="${37+i*33}" x2="340" y2="${37+i*33}" stroke="#695f51" stroke-width="${1+i*.3}"/><text x="56" y="${41+i*33}" text-anchor="end" font-size="11" fill="#4b4033">${i+1}번 ${n}</text>`).join('')}${s.reveal?v.fs.map((f,i)=>{let x=87+(f-lo)*46,y=37+i*33,iv=v.iv[i],fill=iv===0?'#d87832':s.voiceMode==='tension'&&iv===TINT[t]?'#6177ba':'#277a60';return `<circle cx="${x}" cy="${y}" r="16" fill="${fill}" stroke="white" stroke-width="1.5"/><text x="${x}" y="${s.display==='both'?y-2:y+4}" text-anchor="middle" font-size="${s.display==='both'?10:12}" font-weight="700" fill="white">${s.display==='degree'?esc(dg(iv)):esc(pc(OPEN[i]+f))}</text>${s.display==='both'?`<text x="${x}" y="${y+10}" text-anchor="middle" font-size="10" font-weight="700" fill="white">${esc(dg(iv))}</text>`:''}`}).join(''):''}</svg>`}return keyPicker()+panel(`<h2>Jazz Voicing Trainer</h2><div class="row">${button('기본 코드톤',`change('voiceMode','basic')`,s.voiceMode==='basic'?'active':'')}${button('텐션 모드',`change('voiceMode','tension')`,s.voiceMode==='tension'?'active':'')}</div><div class="controls" style="margin-top:12px">${control('코드 종류',select('quality',Object.entries(QUAL).map(([k,x])=>[k,x.name])))}${s.voiceMode==='tension'?control('추가 텐션',select('tension',topts.map(x=>[x,x]))):control('표시 방식',select('display',[['both','음 + 도수'],['degree','도수만'],['note','음만']]))}</div><h3>루트가 있는 줄</h3><div class="grid four">${[1,2,3,4].map(n=>button(n+'번 줄',`change('rootString',${n})`,s.rootString===n?'active':'')).join('')}</div>${s.voiceMode==='tension'?`<div style="margin-top:10px">${control('표시 방식',select('display',[['both','음 + 도수'],['degree','도수만'],['note','음만']]))}</div>`:''}<div class="row between" style="margin:16px 0 8px"><h3>${KEY[s.key]}${q.name}${s.voiceMode==='tension'?' ('+t+')':''}</h3><span class="tag">${s.rootString}번 줄 루트</span></div><div class="fretbox"><div class="row between" style="padding:7px"><small>운지 ${v?index+1:0} / ${arr.length}</small>${button(s.reveal?'운지 숨기기':'정답 보기',`change('reveal',${!s.reveal})`)}</div>${v?fret:'<p class="warning">이 조건에서 네 줄 모두 사용하고 4프렛 폭 이내인 보이싱을 찾지 못했어. 다른 조건을 선택해 봐.</p>'}<div class="legend"><span><i class="dot root"></i>루트 1도</span><span><i class="dot tone"></i>코드톤</span>${s.voiceMode==='tension'?'<span><i class="dot tension"></i>텐션</span>':''}</div></div>${v?`<div class="row" style="margin-top:11px">${button('‹ 이전 운지',`change('shape',${(index-1+arr.length)%arr.length})`)}${button('다음 운지 ›',`change('shape',${(index+1)%arr.length})`,'primary')}</div><div class="grid four" style="margin-top:12px">${v.fs.map((f,i)=>`<div class="note-card ${v.iv[i]===0?'rootcard':''}"><small>${i+1}번 줄</small><b>${esc(dg(v.iv[i]))}</b><div>${pc(OPEN[i]+f)}</div><small>${f}프렛</small></div>`).join('')}</div>`:''}<div class="practice" style="margin-top:12px">루트 줄 확인 → 음과 도수 읽기 → 운지 숨기기 → 다른 운지 → 다음 키. <br><small>음정이 맞는 후보를 계산한 것이며, 모든 운지의 손가락 편의성까지 검증한 것은 아니야.</small></div>`)+tempo()+bottom()}
function lick(){let r=ROOT[s.key],chords=s.lick==='major'?[[2,'m7'],[7,'7'],[0,'maj7']]:s.lick==='minor'?[[2,'m7♭5'],[7,'7'],[0,'m7']]:[[0,'maj7'],[9,'m7'],[2,'m7'],[7,'7']];return keyPicker()+panel(`<h2>Jazz Lick Studio</h2>${control('진행',select('lick',[['major','Major ii–V–I'],['minor','Minor iiø–V–i'],['turn','I–vi–ii–V']]))}<div class="tiles" style="margin-top:15px">${chords.map(([iv,q])=>`<span class="tile">${pc(r+iv)}${q}</span>`).join('')}</div><div class="practice" style="margin-top:12px">각 코드의 3도·7도를 목표음으로 설정하고, 8분음표와 크로매틱 어프로치를 이용해 짧은 프레이즈를 만들어 봐. 5도권으로 전조해 반복해 봐.</div><p class="warning">정확한 오선보가 포함된 재즈 릭은 아직 연결되지 않았어. 이 화면은 진행과 연습 루틴을 제공해.</p>`)+tempo()+bottom()}
function getSongs(){let songs=Array.isArray(window.SOMDA_SONGS)?window.SOMDA_SONGS:[];return s.book==='전체'?songs:songs.filter(x=>x.source===s.book)}function pickSong(){let pool=getSongs();if(!pool.length)return;let remaining=pool.filter(x=>!s.songHistory.includes(x.id));if(!remaining.length){s.songHistory=[];remaining=pool.filter(x=>x.id!==s.songIndex);if(!remaining.length)remaining=pool}let song=remaining[Math.floor(Math.random()*remaining.length)];s.songIndex=song.id;s.songHistory.push(song.id);s.hideScore=false;save();render()}
function head(){let songs=Array.isArray(window.SOMDA_SONGS)?window.SOMDA_SONGS:[],books=[...new Set(songs.map(x=>x.source))],filtered=getSongs(),song=songs.find(x=>x.id===s.songIndex);if(song&&!filtered.some(x=>x.id===song.id))song=filtered[0];return panel(`<h2>Head Melody Shuffle</h2><div class="controls">${control('악보집',`<select onchange="setBook(this.value)"><option value="전체">전체 악보집</option>${books.map(b=>`<option ${s.book===b?'selected':''}>${esc(b)}</option>`).join('')}</select>`)}${control('수록 곡',`<div class="tile">${filtered.length}곡</div>`)}</div><div class="row" style="margin-top:12px">${button('🎲 랜덤 한 곡 뽑기','pickSong()','primary')}${button(s.hideScore?'악보 보기':'악보 숨기기',`change('hideScore',${!s.hideScore})`)}</div>${song?`<h3 style="margin-top:16px">${esc(song.title)}</h3><p class="muted">${esc(song.source)} · ${song.images.length}페이지</p>${s.hideScore?'<div class="practice" style="text-align:center;padding:40px">악보 숨김 · 암보 연습</div>':song.images.map((src,i)=>`<img class="score" loading="lazy" alt="${esc(song.title)} ${i+1}페이지" src="${encodeURI(src)}">`).join('')}`:'<p>악보 라이브러리가 비어 있어.</p>'}<p class="warning">곡 단위로 여러 페이지를 묶은 라이브러리야. 페이지 경계가 모두 검수된 상태는 아니므로 실제 연습 전에 곡 전체가 맞는지 확인해 줘.</p>`)+tempo()+bottom()}
function setBook(b){s.book=b;s.songHistory=[];let list=getSongs();if(list.length)s.songIndex=list[0].id;save();render()}
function calendar(){let [y,m]=s.month.split('-').map(Number),first=(new Date(y,m-1,1).getDay()+6)%7,len=new Date(y,m,0).getDate(),cells=Math.ceil((first+len)/7)*7,entries=Object.entries(s.logs).filter(([k,v])=>k.startsWith(s.month)&&v.length),mins=entries.reduce((a,[,v])=>a+v.reduce((b,l)=>b+l.min,0),0),dayLogs=s.logs[s.day]||[];return panel(`<h2>Practice Tracker</h2><div class="stats"> <div class="stat"><small>이번 달 시간</small><strong>${mins}분</strong></div><div class="stat"><small>연습일</small><strong>${entries.length}일</strong></div><div class="stat"><small>전체 기록</small><strong>${Object.values(s.logs).flat().length}개</strong></div></div><div class="row between" style="margin:17px 0">${button('‹','shiftMonth(-1)')}<b>${y}년 ${m}월</b>${button('›','shiftMonth(1)')}</div><div class="calendar">${['월','화','수','목','금','토','일'].map(x=>`<div class="dayhead">${x}</div>`).join('')}${Array.from({length:cells},(_,i)=>{let d=i-first+1,k=`${s.month}-${String(d).padStart(2,'0')}`;return d>0&&d<=len?`<button class="day ${s.day===k?'sel':''} ${s.logs[k]?.length?'has':''}" onclick="change('day','${k}')">${d}</button>`:'<div class="day empty"></div>'}).join('')}</div><h3 style="margin-top:18px">${s.day} 연습 기록</h3>${dayLogs.length?dayLogs.map((l,i)=>`<div class="log"><span><b>${esc(l.cat)}</b> · ${l.min}분<br><small>${esc(l.key)} Key · ${esc(l.memo)}</small></span>${button('삭제',`deleteLog(${i})`)}</div>`).join(''):'<p class="muted">아직 기록이 없어.</p>'}<div class="practice" style="margin-top:14px"><h3>연습 추가</h3><div class="controls">${control('분류',`<select id="logcat">${['스케일','코드톤','재즈 보이싱','재즈 릭','헤드 멜로디','즉흥연주','기타'].map(x=>`<option ${s.logCategory===x?'selected':''}>${x}</option>`).join('')}</select>`)}${control('연습 시간 (분)',`<input id="logmin" type="number" min="1" max="600" value="15">`)}</div><div class="control" style="margin-top:9px">${control('메모 / 곡명 / BPM',`<textarea id="logmemo" placeholder="오늘 연습한 내용"></textarea>`)}</div>${button('기록 저장','addLog()','primary')}</div>`)}function shiftMonth(n){let [y,m]=s.month.split('-').map(Number),d=new Date(y,m-1+n,1);s.month=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;s.day=s.month+'-01';save();render()}function addLog(){let min=Number($('logmin').value);if(!Number.isFinite(min)||min<1||min>600){alert('연습 시간을 1~600분으로 입력해 줘.');return}let entry={cat:$('logcat').value,min,key:KEY[s.key],memo:$('logmemo').value};s.logs[s.day]=[...(s.logs[s.day]||[]),entry];save();render()}function deleteLog(i){s.logs[s.day].splice(i,1);save();render()}
function render(){document.title='SOMDA GUITAR LAB';$('tabs').innerHTML=TABS.map(([id,n])=>`<button class="tab ${s.tab===id?'active':''}" onclick="change('tab','${id}')">${n}</button>`).join('');$('content').innerHTML=({home,scale,tones,voice:voicings,lick,head,calendar}[s.tab]||home)();resetMetro()}render();
</script></body></html>
